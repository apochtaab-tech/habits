<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Привычки на 20 дней</title>
<style>
:root{--bg:#edf0f5;--card:#fff;--ink:#101a33;--muted:#6b7690;--line:#dce2ee;--acc:#2447f5;--accsoft:#e3e9ff;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1426;--card:#172041;--ink:#edf1ff;--muted:#8d9ac0;--line:#26315a;--acc:#7b94ff;--accsoft:#222d5c;--onacc:#0e1426}}
:root[data-theme="dark"]{--bg:#0e1426;--card:#172041;--ink:#edf1ff;--muted:#8d9ac0;--line:#26315a;--acc:#7b94ff;--accsoft:#222d5c;--onacc:#0e1426}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:15px;font-weight:600;color:var(--muted);margin:4px 0 12px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:52px;padding:8px 0 9px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center;color:var(--ink);font:inherit;scroll-snap-align:center;cursor:pointer}
.chip small{display:block;font-size:12px;color:var(--muted)}
.chip b{display:block;font-size:19px;font-weight:700;margin:1px 0 4px}
.chip i{display:block;height:4px;border-radius:2px;margin:0 10px;background:var(--line);position:relative;overflow:hidden}
.chip i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--acc)}
.chip.sel{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.chip.sel small{color:inherit;opacity:.8}
.chip.sel i{background:rgba(255,255,255,.3)}
.chip.sel i::after{background:var(--onacc)}
.chip.today{box-shadow:0 0 0 2px var(--accsoft)}
.hero{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 18px;margin:4px 0 8px}
.ring{position:relative;width:84px;height:84px;flex:0 0 84px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--acc);transition:stroke-dashoffset .35s ease}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;font-weight:800}
.hero h2{margin:0;font-size:22px;line-height:1.15}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.note{background:var(--accsoft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:14px;margin:8px 0}
.slot{font-size:14px;font-weight:600;color:var(--muted);margin:18px 4px 8px}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 14px;margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:18px;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .12s}
.item:active{transform:scale(.98)}
.ico{font-size:24px;width:30px;text-align:center}
.txt{flex:1;min-width:0}
.txt b{display:block;font-weight:600;font-size:16px}
.txt small{color:var(--muted);font-size:14px}
.box{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 30px;transition:all .15s}
.box svg{width:16px;height:16px;stroke:var(--onacc);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:all .15s}
.item.done{background:transparent}
.item.done .txt b{color:var(--muted);text-decoration:line-through}
.item.done .box{background:var(--acc);border-color:var(--acc)}
.item.done .box svg{opacity:1;transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px}
.card h3{margin:0 0 12px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800}
.stat small{color:var(--muted);font-size:13px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hd{text-align:center;font-size:12px;color:var(--muted)}
.cell{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--line);color:var(--ink);border:0;font-family:inherit;cursor:pointer}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.wk{width:100%;border-collapse:collapse;font-size:14px}
.wk th{font-weight:500;color:var(--muted);text-align:center;padding:0 0 8px}
.wk th:first-child,.wk td:first-child{text-align:left}
.wk td{padding:7px 0;border-top:1px solid var(--line);text-align:center}
.wk td:first-child{white-space:nowrap}
.wk .ok{color:var(--acc);font-weight:700}
.tip{color:var(--muted);font-size:14px;margin:4px 4px 12px}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:220px;padding:10px;border-radius:14px;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--accsoft);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav><button id="t0" class="on">Сегодня</button><button id="t1">Прогресс</button></nav>
<script>
var START=new Date(2026,10,23),N=20,KEY="habits20-v1";
var WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"],MO=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var PULL=[12,16,20],PUSH=[20,25,30];
var H={
breath:{n:"Дыхательная практика",e:"🌬️",d:"10 мин"},diction:{n:"Дикция",e:"🗣️",d:"15 мин"},read:{n:"Чтение",e:"📖",d:"15 мин"},
kettle:{n:"Гири",e:"🏋️",d:"15 мин"},legs:{n:"Ноги",e:"🦵",d:"15 мин"},
pull:{n:"Подтягивания",e:"🧗",d:function(w){return PULL[w]+" шт, подходами"}},
push:{n:"Отжимания",e:"💪",d:function(w){return PUSH[w]+" шт, подходами"}},
cardio:{n:"Кардио",e:"🏃",d:"10 мин"},poem:{n:"Учить стихотворение",e:"📜",d:"10 мин"},
stretch:{n:"Растяжка",e:"🤸",d:"15 мин"},meditate:{n:"Медитация",e:"🧘",d:"15 мин"}};
var SLOTS=[["Утро",["breath","diction","read"]],["День",["kettle","legs","pull","push","cardio"]],["Вечер",["poem","stretch","meditate"]]];
var SCH={0:["cardio","diction","stretch","meditate"],1:["read","kettle","pull","push","breath","poem"],2:["read","legs","cardio","diction","pull","push"],
3:["read","kettle","stretch","meditate"],4:["read","pull","push","cardio","breath","poem"],5:["read","kettle","cardio","diction","pull","push"],
6:["legs","cardio","pull","push","breath","poem"]};
var done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
function dt(i){return new Date(START.getFullYear(),START.getMonth(),START.getDate()+i)}
function plan(i){return SCH[dt(i).getDay()]}
function cnt(i){var p=plan(i),c=0;p.forEach(function(h){if(done[i+":"+h])c++});return c}
function pct(i){return Math.round(100*cnt(i)/plan(i).length)}
var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
var today=Math.round((t0-START)/864e5);
var sel=Math.max(0,Math.min(N-1,today)),tab=0;
function streak(){var i=Math.min(today,N-1);if(i<0)return 0;if(pct(i)<100)i--;var s=0;while(i>=0&&pct(i)===100){s++;i--}return s}
function check(){return '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>'}
function viewToday(){
var p=plan(sel),d=dt(sel),w=Math.floor(sel/7),c=cnt(sel),tot=p.length,pc=pct(sel),R=37,L=2*Math.PI*R;
var s='<h1>20 дней · '+d.getDate()+" "+MO[d.getMonth()]+", день "+(sel+1)+" из "+N+"</h1><div class=strip id=strip>";
for(var i=0;i<N;i++){var x=dt(i);s+='<button class="chip'+(i===sel?" sel":"")+(i===today?" today":"")+'" data-d='+i+' aria-label="День '+(i+1)+'"><small>'+WD[x.getDay()]+'</small><b>'+x.getDate()+'</b><i style="--p:'+pct(i)+'%"></i></button>'}
s+='</div>';
if(today<0)s+='<div class=note>Старт в понедельник, 23 ноября. Можно заглянуть в план заранее.</div>';
s+='<div class=hero><div class=ring><svg width=84 height=84 viewBox="0 0 84 84"><circle class=bg cx=42 cy=42 r='+R+'></circle><circle class=fg cx=42 cy=42 r='+R+' stroke-dasharray="'+L+'" stroke-dashoffset="'+(L*(1-pc/100))+'"></circle></svg><span>'+pc+'%</span></div><div><h2>'+(c===tot?"День закрыт":"Выполнено "+c+" из "+tot)+'</h2><p>Серия: '+streak()+' '+plural(streak(),["день","дня","дней"])+' подряд</p></div></div>';
SLOTS.forEach(function(sl){
var hs=sl[1].filter(function(h){return p.indexOf(h)>-1});if(!hs.length)return;
s+='<div class=slot>'+sl[0]+'</div>';
hs.forEach(function(h){var o=H[h],dd=typeof o.d==="function"?o.d(w):o.d,on=done[sel+":"+h];
s+='<button class="item'+(on?" done":"")+'" data-h='+h+' aria-pressed='+(on?"true":"false")+'><span class=ico>'+o.e+'</span><span class=txt><b>'+o.n+'</b><small>'+dd+'</small></span><span class=box>'+check()+'</span></button>'});
});
s+='<p class=tip>Плохой день? Сделай 2 минуты вместо пропуска. Два пропуска подряд не допускаем.</p>';
return s}
function viewProg(){
var full=0,sum=0,days=Math.max(0,Math.min(N,today+1));
for(var i=0;i<N;i++){if(pct(i)===100)full++;sum+=cnt(i)}
var all=0;for(i=0;i<N;i++)all+=plan(i).length;
var s='<h1>Прогресс</h1><div class=stats><div class=stat><b>'+full+'</b><small>дней закрыто</small></div><div class=stat><b>'+streak()+'</b><small>серия</small></div><div class=stat><b>'+Math.round(100*sum/all)+'%</b><small>всего плана</small></div></div>';
s+='<div class=card><h3>Календарь</h3><div class=heat>';
["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(function(n){s+='<div class=hd>'+n+'</div>'});
for(i=0;i<N;i++){var a=pct(i)/100,bgc=a?'color-mix(in srgb,var(--acc) '+Math.round(20+a*80)+'%,var(--line))':'var(--line)',fc=a>.55?'var(--onacc)':'var(--ink)';
s+='<button class="cell'+(i===sel?" sel":"")+'" data-c='+i+' style="background:'+bgc+';color:'+fc+'">'+dt(i).getDate()+'</button>'}
s+='</div></div>';
s+='<div class=card><h3>По привычкам, выполнено / план</h3><table class=wk><tr><th></th><th>Нед. 1</th><th>Нед. 2</th><th>Нед. 3</th></tr>';
Object.keys(H).forEach(function(h){s+='<tr><td>'+H[h].e+" "+H[h].n+'</td>';
for(var w=0;w<3;w++){var pl=0,dn=0;for(var j=w*7;j<Math.min(N,w*7+7);j++){if(plan(j).indexOf(h)>-1){pl++;if(done[j+":"+h])dn++}}
s+='<td class="'+(pl&&dn===pl?"ok":"")+'">'+dn+" / "+pl+'</td>'}s+='</tr>'});
s+='</table></div><button class=reset id=reset>Сбросить отметки</button>';
return s}
function plural(n,f){var a=n%10,b=n%100;return b>10&&b<20?f[2]:a===1?f[0]:a>1&&a<5?f[1]:f[2]}
function render(keep){var app=document.getElementById("app"),y=window.scrollY;
app.innerHTML=tab?viewProg():viewToday();
document.getElementById("t0").className=tab?"":"on";document.getElementById("t1").className=tab?"on":"";
if(!tab){var c=document.querySelector(".chip.sel");if(c)document.getElementById("strip").scrollLeft=c.offsetLeft-document.getElementById("strip").clientWidth/2+26}
window.scrollTo(0,keep?y:0)}
document.addEventListener("click",function(e){
var t=e.target.closest("button");if(!t)return;
if(t.id==="t0"){tab=0;render();return}if(t.id==="t1"){tab=1;render();return}
if(t.dataset.d!==undefined){sel=+t.dataset.d;render(true);return}
if(t.dataset.c!==undefined){sel=+t.dataset.c;tab=0;render();return}
if(t.dataset.h){var k=sel+":"+t.dataset.h;if(done[k])delete done[k];else done[k]=1;save();
if(navigator.vibrate)try{navigator.vibrate(10)}catch(x){}render(true);return}
if(t.id==="reset"){if(confirm("Сбросить все отметки за 20 дней?")){done={};save();render()}}
});
render();
</script>
</body>
</html>
